<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epic Ass Car Game | WebGL Player</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #0b0e14;
        --card-bg: #151a23;
        --border-color: #262f40;
        --accent-primary: #3b82f6;
        --accent-glow: rgba(59, 130, 246, 0.5);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(
          circle at 50% 0%,
          #1e293b 0%,
          var(--bg-color) 70%
        );
        color: var(--text-main);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      #unity-container {
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
        overflow: hidden;
        transition: all 0.3s ease;
      }

      #unity-container.unity-desktop {
        width: 960px;
        max-width: 95vw;
      }

      #unity-container.unity-mobile {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }

      #canvas-wrapper {
        position: relative;
        width: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: block;
        background: #05070a;
      }

      .unity-mobile #unity-canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Custom Modern Loading Overlay */
      #unity-loading-bar {
        position: absolute;
        inset: 0;
        background: rgba(11, 14, 20, 0.92);
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        gap: 20px;
      }

      .game-loader-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      #unity-progress-bar-empty {
        width: 280px;
        height: 8px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        box-shadow: 0 0 12px var(--accent-glow);
        border-radius: 999px;
        transition: width 0.2s ease-out;
      }

      #loading-percentage {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      /* Warning / Error Banner */
      #unity-warning {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: none;
        width: 90%;
        max-width: 600px;
      }

      .banner-msg {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .banner-error {
        background: rgba(220, 38, 38, 0.95);
        color: #fff;
        border: 1px solid #f87171;
      }

      .banner-warning {
        background: rgba(217, 119, 6, 0.95);
        color: #fff;
        border: 1px solid #fbbf24;
      }

      /* Sleek Control Bar Footer */
      #unity-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: var(--card-bg);
        border-top: 1px solid var(--border-color);
      }

      .unity-mobile #unity-footer {
        display: none;
      }

      .footer-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      }

      #unity-build-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: 0.02em;
      }

      #unity-fullscreen-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #1e293b;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #unity-fullscreen-button:hover {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      #unity-fullscreen-button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="canvas-wrapper">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

        <div id="unity-loading-bar">
          <div class="game-loader-title">Epic Ass Car Game</div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div id="loading-percentage">Loading... 0%</div>
        </div>

        <div id="unity-warning"></div>
      </div>

      <div id="unity-footer">
        <div class="footer-left">
          <span class="status-dot"></span>
          <div id="unity-build-title">Epic Ass Car Game</div>
        </div>
        <button id="unity-fullscreen-button" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg>
          <span>Fullscreen</span>
        </button>
      </div>
    </div>

    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const loadingPercentage = document.querySelector("#loading-percentage");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }

        const div = document.createElement("div");
        div.innerHTML = msg;
        div.className =
          "banner-msg " + (type === "error" ? "banner-error" : "banner-warning");
        warningBanner.appendChild(div);

        if (type !== "error") {
          setTimeout(() => {
            if (warningBanner.contains(div)) {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }
          }, 5000);
        }
        updateBannerVisibility();
      }

      const buildUrl = "build";
      const loaderUrl = buildUrl + "/build3.loader.js";
      const config = {
        dataUrl: buildUrl + "/build3.data.gz",
        frameworkUrl: buildUrl + "/build3.framework.js.gz",
        codeUrl: buildUrl + "/build3.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Cargame",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        unityShowBanner(
          "WebGL builds are not officially supported on mobile devices.",
          "warning"
        );
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "flex";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const pct = Math.round(100 * progress);
          progressBarFull.style.width = pct + "%";
          loadingPercentage.textContent = `Loading... ${pct}%`;
        })
          .then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          })
          .catch((message) => {
            unityShowBanner(message, "error");
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
